version: "3.9"

services:

  # -----------------------------
  # FastAPI
  # -----------------------------
  sentinel-api:
    build:
      context: .
      dockerfile: Dockerfile

    image: sentinel-ai:latest
    container_name: sentinel-api

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./model:/app/model

    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

    networks:
      - sentinel-network


  # -----------------------------
  # PostgreSQL
  # -----------------------------
  postgres:
    image: postgres:15

    container_name: sentinel-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel123
      POSTGRES_DB: sentinel_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - sentinel-network


  # -----------------------------
  # MLflow
  # -----------------------------
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile

    image: sentinel-mlflow:latest

    container_name: sentinel-mlflow

    restart: unless-stopped

    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql://sentinel:sentinel123@postgres:5432/sentinel_db
      - --default-artifact-root
      - /mlflow/artifacts

    ports:
      - "5000:5000"

    volumes:
      - mlflow_artifacts:/mlflow/artifacts

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

    networks:
      - sentinel-network


volumes:
  postgres_data:
  mlflow_artifacts:


networks:
  sentinel-network:
    driver: bridge