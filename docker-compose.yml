services:

  # -----------------------------
  # FastAPI
  # -----------------------------
  sentinel-api:
    build:
      context: .
      dockerfile: Dockerfile

    image: sentinel-ai:latest
    container_name: sentinel-api

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./model:/app/model
      - ./data/chroma:/app/data/chroma

    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

    networks:
      - sentinel-network


  # -----------------------------
  # PostgreSQL
  # -----------------------------
  postgres:
    image: postgres:15

    container_name: sentinel-postgres

    restart: unless-stopped

    # Credentials come from .env (see .env.example). The defaults are
    # non-secret local placeholders only; POSTGRES_PASSWORD is applied
    # by the image only when the data volume is first initialised.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-local}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      # $$ defers expansion to the container, where the vars are set
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - sentinel-network


  # -----------------------------
  # MLflow
  # -----------------------------
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile

    image: sentinel-mlflow:latest

    container_name: sentinel-mlflow

    restart: unless-stopped

    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      # The backend store URI (which carries the DB password) is passed
      # through MLFLOW_BACKEND_STORE_URI below, not as an argument, so it
      # does not appear in the process list. mlflow server reads it via
      # its --backend-store-uri envvar (verified on MLflow 3.15.2).
      - --default-artifact-root
      - /mlflow/artifacts


    ports:
      - "5000:5000"
    
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,localhost:5000,127.0.0.1:5000"
      # Built from the same .env vars as the postgres service
      MLFLOW_BACKEND_STORE_URI: "postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-changeme-local}@postgres:5432/${POSTGRES_DB:-sentinel_db}"

    volumes:
      - mlflow_artifacts:/mlflow/artifacts

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

    networks:
      - sentinel-network


volumes:
  postgres_data:
  mlflow_artifacts:


networks:
  sentinel-network:
    driver: bridge